function parseCandidateURL(value){
 const raw=String(value||'').trim();
 if(!raw)throw new Error('empty');
 if(/^[\u0000-\u0020]*javascript:/i.test(raw)||/^[\u0000-\u0020]*data:/i.test(raw)||/^[\u0000-\u0020]*file:/i.test(raw))throw new Error('protocol');
 const candidate=/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)?raw:'https://'+raw;
 const u=new URL(candidate);
 if(!['http:','https:'].includes(u.protocol))throw new Error('protocol');
 if(!u.hostname||u.hostname.includes(' '))throw new Error('host');
 return {raw,u};
}
function localURLAssessment(value){

 const {raw,u}=parsed,host=u.hostname.toLowerCase().replace(/\.$/,''),flags=[];let score=0;
 const add=(points,msg)=>{if(!flags.includes(msg)){flags.push(msg);score+=points}};
 if(u.protocol!=='https:')add(8,'Нет HTTPS. Это не доказывает мошенничество, но соединение не защищено шифрованием.');
 if(u.username||u.password)add(35,'В адресе есть логин/пароль перед символом @ — частый приём маскировки адреса.');
 if(host.includes('xn--'))add(22,'Домен использует Punycode; похожие символы могут маскировать настоящий адрес.');
 if(/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host)||host.startsWith('['))add(25,'Вместо обычного домена используется IP-адрес.');
 const parts=host.split('.');if(parts.length>4)add(10,'У адреса необычно много уровней поддоменов.');
 if(u.port && !['80','443'].includes(u.port))add(8,'Используется нестандартный порт.');
 if(P.shorteners.some(x=>host===x||host.endsWith('.'+x)))add(18,'Ссылка сокращена — конечный адрес скрыт до перехода.');
 const tld=parts[parts.length-1]||'';if(P.suspiciousTlds.includes(tld))add(12,'Доменная зона иногда встречается в массовых мошеннических рассылках; сама по себе не доказывает угрозу.');
 if((host.match(/-/g)||[]).length>=3)add(8,'В доменном имени много дефисов.');
 const official=P.officialDomains||[];
 const isListed=official.some(d=>host===d||host.endsWith('.'+d));
 const brand=(P.brandKeywords||[]).find(b=>host.includes(b));
 if(brand&&!isListed)add(24,'В имени домена есть название известного бренда ('+brand+'), но адрес не совпадает с его доменом из локального списка.');
 if(/\.apk(?:$|[?#])/i.test(u.pathname+u.search))add(25,'Ссылка указывает на APK-файл приложения. Не устанавливайте приложение из неожиданного сообщения.');
 if(/%[0-9a-f]{2}/i.test(host))add(8,'В адресе домена есть percent-кодирование, которое стоит проверить внимательно.');
 score=Math.min(100,score);
 return {url:raw,host,score,level:score>=35?'high':score>=15?'caution':'unknown',flags,listedLocally:isListed};
}

let fsSb=null,fsSbKey='';
function initCloudClient(){
 const cfg=ld('fs_cloud_cfg',{});const u=(document.getElementById('cloud-url')?.value||cfg.url||'').trim();const k=(document.getElementById('cloud-key')?.value||cfg.key||'').trim();
 if(!u||!k){toast('Сначала укажите Supabase URL и публичный anon/publishable key');return null}
 try{new URL(u)}catch(e){toast('Некорректный Supabase URL');return null}
 if(!window.supabase||!window.supabase.createClient){toast('SDK не загружен. Проверьте интернет-соединение.');return null}
 const cfgKey=u+'|'+k;if(fsSb&&fsSbKey===cfgKey)return fsSb;sv('fs_cloud_cfg',{url:u,key:k});fsSb=window.supabase.createClient(u,k);fsSbKey=cfgKey;return fsSb;
}
function cloudStatus(s){const e=document.getElementById('cloud-status');if(e)e.textContent=s}
async function cloudAuth(mode){
 const client=initCloudClient();if(!client)return;
 const email=(document.getElementById('cloud-email')?.value||'').trim(),password=document.getElementById('cloud-password')?.value||'';
 if(mode!=='signout'&&(!email||!password)){cloudStatus('Введите email и пароль.');return}
 cloudStatus('Выполняется запрос…');
 try{let r;if(mode==='signup')r=await client.auth.signUp({email,password});else if(mode==='signin')r=await client.auth.signInWithPassword({email,password});else r=await client.auth.signOut();
  if(r.error)throw r.error;cloudStatus(mode==='signup'?'Запрос регистрации отправлен. Если включено подтверждение email, проверьте почту.':mode==='signin'?'Вход выполнен. Теперь можно включить синхронизацию.':'Вы вышли из аккаунта.');
 }catch(e){cloudStatus('Ошибка авторизации: '+(e.message||'проверьте настройки проекта'))}
}
async function syncCloud(){
 const client=fsSb||initCloudClient();if(!client)return;
 const consent=document.getElementById('cloud-consent');if(!consent?.checked){cloudStatus('Перед синхронизацией отметьте согласие: текст истории будет передан в вашу базу Supabase.');return}
 cloudStatus('Проверяем сессию…');
 try{
  const {data:{user},error:userErr}=await client.auth.getUser();if(userErr||!user){cloudStatus('Сначала войдите в аккаунт.');return}
  if(hist.length){const rows=hist.map(h=>({user_id:user.id,local_id:String(h.id),record:h,updated_at:new Date().toISOString()}));const {error}=await client.from('scan_history').upsert(rows,{onConflict:'user_id,local_id'});if(error)throw error}
  const {data,error}=await client.from('scan_history').select('record,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(60);if(error)throw error;
  const remote=(data||[]).map(r=>r.record).filter(h=>h&&typeof h.id==='number'&&typeof h.t==='string'&&typeof h.s==='number');
  const merged=new Map([...remote,...hist].map(h=>[h.id,h]));hist=[...merged.values()].sort((a,b)=>b.id-a.id).slice(0,60);sv('fs_h',hist);
  cloudStatus('Синхронизация завершена. Записей в локальной истории: '+hist.length+'.');if(view==='stats'||view==='hist')render(true);
 }catch(e){cloudStatus('Синхронизация не удалась: '+(e.message||'проверьте SQL/RLS и доступ к таблице scan_history'))}
}
